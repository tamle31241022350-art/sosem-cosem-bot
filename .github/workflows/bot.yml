name: SOSEM COSEM Bot

on:
  # ⚠️ KHÔNG dùng 'schedule:' của GitHub ở đây.
  # Đã kiểm chứng: với repo mới/ít hoạt động như repo này, GitHub tự trễ
  # lịch 'schedule' tới vài tiếng — trễ hơn cả deadline, nên chỉ tạo ra
  # lỗi giả mỗi ngày mà không hề cứu được lần nào. Nguồn kích hoạt thật
  # là cron-job.org gọi thẳng API workflow_dispatch (xem ghi chú dự án),
  # vì dispatch tường minh chạy gần như tức thì, không đi qua hàng đợi
  # 'schedule' bị nghẽn.

  # Cho phép bấm chạy tay để test
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (KHÔNG bấm nút đăng ký thật)"
        type: boolean
        default: true
      target_time:
        description: "Giờ mở đăng ký, giờ VN, dạng HH:MM"
        type: string
        default: "19:30"
      window_minutes:
        description: "Poll trong bao nhiêu phút kể từ giờ mở"
        type: string
        default: "60"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Job chạy 18:30 -> 20:30 = 120 phút. Để 180 cho an toàn,
    # nhưng vẫn có trần để job lỗi không treo tới 6 tiếng (mặc định GitHub).
    timeout-minutes: 180

    env:
      # Log in ra giờ VN cho dễ đọc, khỏi phải trừ 7 tiếng trong đầu
      TZ: Asia/Ho_Chi_Minh
      # Bắt Python in log ngay lập tức, không giữ trong buffer.
      # Thiếu dòng này thì tab Actions trống trơn suốt 1 tiếng rồi mới xổ ra một lượt.
      PYTHONUNBUFFERED: "1"

      UEH_EMAIL: ${{ secrets.UEH_EMAIL }}
      UEH_PASSWORD: ${{ secrets.UEH_PASSWORD }}
      GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}

      # Khi chạy theo schedule thì inputs rỗng -> rơi về giá trị mặc định bên phải
      TARGET_TIME: ${{ inputs.target_time || '19:30' }}
      WINDOW_MINUTES: ${{ inputs.window_minutes || '60' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

      LEAD_SECONDS: "120"        # login trước giờ G 2 phút
      POLL_FAST_SECONDS: "2"     # 10 phút đầu: quét mỗi 2 giây
      POLL_SLOW_SECONDS: "10"    # sau đó: mỗi 10 giây
      FAST_MINUTES: "10"
      KEYWORDS: "SOSEM,COSEM"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Show clock (sanity check)
        run: |
          echo "UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "VN  : $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Run bot
        run: python main.py
